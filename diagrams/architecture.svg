<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: source indices are profiled by a workflow into Knowledge Indicators in an AI Index; the agent reads the indicators first, then queries the right source">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#343741"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1a1c21; }
      .sub { font-size: 15px; fill: #516381; }
      .zone { fill: #f6f9fc; stroke: #cad3e2; stroke-width: 1.5; rx: 14; }
      .zoneTitle { font-size: 14px; font-weight: 700; fill: #516381; letter-spacing: .5px; }
      .box { fill: #ffffff; stroke: #343741; stroke-width: 1.5; rx: 10; }
      .elastic { fill: #e6f1fa; stroke: #0b64dd; stroke-width: 2; rx: 12; }
      .feat { fill: #ffffff; stroke: #0b64dd; stroke-width: 1.3; rx: 8; }
      .brain { fill: #fff8e6; stroke: #b7791f; stroke-width: 2; rx: 10; }
      .h { font-size: 15px; font-weight: 700; fill: #1a1c21; }
      .t { font-size: 12.5px; fill: #343741; }
      .edge { stroke: #343741; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edgeLabel { font-size: 12px; font-weight: 600; fill: #343741; }
      .pain { fill: #fff3f0; stroke: #c61e25; stroke-width: 1.3; rx: 8; }
      .painT { font-size: 12.5px; fill: #8a0f14; }
      .fixT { font-size: 12.5px; fill: #09724d; font-weight: 600; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="40" y="48" class="title">Privatbank Albisgrat: a context layer for every agent</text>
  <text x="40" y="74" class="sub">The model stays the same. What changes is what it knows before it starts. Everything in the blue box is Elasticsearch.</text>

  <rect x="30" y="100" width="940" height="420" class="elastic"/>
  <text x="48" y="126" class="zoneTitle" fill="#0b64dd">ELASTICSEARCH SERVERLESS</text>

  <!-- sources -->
  <rect x="48" y="142" width="250" height="360" class="feat"/>
  <text x="62" y="166" class="h">The bank's data</text>
  <rect x="62" y="182" width="222" height="84" class="box"/>
  <text x="74" y="206" class="h">Knowledge base</text>
  <text x="74" y="226" class="t">Swiss law and internal policies,</text>
  <text x="74" y="244" class="t">four languages, hybrid search</text>
  <rect x="62" y="282" width="222" height="84" class="box"/>
  <text x="74" y="306" class="h">Outsourcing inventory</text>
  <text x="74" y="326" class="t">Providers, data location,</text>
  <text x="74" y="344" class="t">approvals, review dates</text>
  <rect x="62" y="382" width="222" height="84" class="box"/>
  <text x="74" y="406" class="h">Incident register</text>
  <text x="74" y="426" class="t">Category, severity, reported</text>
  <text x="74" y="444" class="t">in time, linked arrangement</text>

  <!-- workflow -->
  <rect x="338" y="142" width="250" height="150" class="feat"/>
  <text x="352" y="166" class="h">Kibana Workflow</text>
  <text x="352" y="190" class="t">Reads each index's mapping</text>
  <text x="352" y="208" class="t">and a few samples, asks an LLM</text>
  <text x="352" y="226" class="t">for a profile, writes it as a</text>
  <text x="352" y="244" class="t">Knowledge Indicator</text>
  <rect x="338" y="312" width="250" height="190" class="feat"/>
  <text x="352" y="336" class="h">Your experts</text>
  <text x="352" y="360" class="t">Own what cannot be read from</text>
  <text x="352" y="378" class="t">the data: what "material</text>
  <text x="352" y="396" class="t">outsourcing" means here, which</text>
  <text x="352" y="414" class="t">incidents are reportable, the</text>
  <text x="352" y="432" class="t">glossary in four languages</text>

  <!-- AI index -->
  <rect x="628" y="142" width="322" height="360" class="brain"/>
  <text x="644" y="168" class="h">AI Index: Knowledge Indicators</text>
  <text x="644" y="194" class="t">An ordinary index with a naming</text>
  <text x="644" y="212" class="t">convention. Hybrid search built in.</text>
  <rect x="644" y="230" width="290" height="54" class="box"/>
  <text x="656" y="252" class="h">Index profiles</text>
  <text x="656" y="270" class="t">what each index answers, and what not</text>
  <rect x="644" y="294" width="290" height="54" class="box"/>
  <text x="656" y="316" class="h">Business definitions</text>
  <text x="656" y="334" class="t">the bank's own rules, with a query</text>
  <rect x="644" y="358" width="290" height="54" class="box"/>
  <text x="656" y="380" class="h">Policy register</text>
  <text x="656" y="398" class="t">which version is in force</text>
  <rect x="644" y="422" width="290" height="54" class="box"/>
  <text x="656" y="444" class="h">Glossary</text>
  <text x="656" y="462" class="t">one term in DE, FR, IT, EN</text>

  <path d="M298 216 L336 216" class="edge"/>
  <path d="M588 216 L626 216" class="edge"/>
  <path d="M588 406 L626 406" class="edge"/>

  <!-- agent and users -->
  <rect x="1010" y="100" width="240" height="420" class="zone"/>
  <text x="1026" y="126" class="zoneTitle">AGENTS AND PEOPLE</text>
  <rect x="1026" y="142" width="208" height="150" class="box"/>
  <text x="1038" y="166" class="h">Agent (Agent Builder)</text>
  <text x="1038" y="190" class="t">Step 1: one lookup in the</text>
  <text x="1038" y="208" class="t">AI Index</text>
  <text x="1038" y="232" class="t">Step 2: query the right</text>
  <text x="1038" y="250" class="t">index with ES|QL</text>
  <text x="1038" y="274" class="t">Any model, any harness</text>
  <rect x="1026" y="312" width="208" height="84" class="box"/>
  <text x="1038" y="336" class="h">Compliance, front office</text>
  <text x="1038" y="356" class="t">ask in their own language</text>
  <rect x="1026" y="412" width="208" height="90" class="box"/>
  <text x="1038" y="436" class="h">Other agents</text>
  <text x="1038" y="456" class="t">ticket triage, nightly checks:</text>
  <text x="1038" y="474" class="t">same context, no re-learning</text>

  <path d="M1024 200 L952 200" class="edge"/>
  <text x="958" y="190" class="edgeLabel">1</text>
  <path d="M1024 250 C 990 560, 320 560, 200 504" class="edge"/>
  <text x="600" y="548" class="edgeLabel">2</text>

  <g>
    <circle cx="950" cy="142" r="13" fill="#0b64dd"/><text x="950" y="147" text-anchor="middle" class="num">1</text>
    <circle cx="950" cy="294" r="13" fill="#0b64dd"/><text x="950" y="299" text-anchor="middle" class="num">2</text>
    <circle cx="588" cy="142" r="13" fill="#0b64dd"/><text x="588" y="147" text-anchor="middle" class="num">3</text>
    <circle cx="1234" cy="412" r="13" fill="#0b64dd"/><text x="1234" y="417" text-anchor="middle" class="num">4</text>
  </g>

  <g>
    <rect x="30" y="574" width="296" height="126" class="pain"/>
    <circle cx="54" cy="596" r="13" fill="#0b64dd"/><text x="54" y="601" text-anchor="middle" class="num">1</text>
    <text x="76" y="601" class="h">Agents explore, every time</text>
    <text x="46" y="628" class="painT">❌ Mappings, samples, test queries</text>
    <text x="46" y="646" class="painT">    before any answer</text>
    <text x="46" y="672" class="fixT">✅ One lookup tells it where to go</text>

    <rect x="338" y="574" width="296" height="126" class="pain"/>
    <circle cx="362" cy="596" r="13" fill="#0b64dd"/><text x="362" y="601" text-anchor="middle" class="num">2</text>
    <text x="384" y="601" class="h">Wrong on your own terms</text>
    <text x="354" y="628" class="painT">❌ The model guesses what</text>
    <text x="354" y="646" class="painT">    "material" means at this bank</text>
    <text x="354" y="672" class="fixT">✅ Your definition, with its query</text>

    <rect x="646" y="574" width="296" height="126" class="pain"/>
    <circle cx="670" cy="596" r="13" fill="#0b64dd"/><text x="670" y="601" text-anchor="middle" class="num">3</text>
    <text x="692" y="601" class="h">Context written by hand</text>
    <text x="662" y="628" class="painT">❌ Prompts per team, out of date</text>
    <text x="662" y="646" class="painT">    the day after</text>
    <text x="662" y="672" class="fixT">✅ A workflow keeps profiles fresh</text>

    <rect x="954" y="574" width="296" height="126" class="pain"/>
    <circle cx="978" cy="596" r="13" fill="#0b64dd"/><text x="978" y="601" text-anchor="middle" class="num">4</text>
    <text x="1000" y="601" class="h">Cost grows with every agent</text>
    <text x="970" y="628" class="painT">❌ Each agent pays to rediscover</text>
    <text x="970" y="646" class="painT">    the same data</text>
    <text x="970" y="672" class="fixT">✅ Context is shared and reused</text>
  </g>
</svg>
